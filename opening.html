<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오프닝 - 한 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pieces.css">
<link rel="stylesheet" href="css/site.css">
<style>
.ob{background:var(--band);color:#242942}
.ob h1{font-size:clamp(32px,4.6vw,48px);margin-bottom:16px}
.ogrid2{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:clamp(18px,3vw,32px);align-items:start;max-width:1240px;margin:0 auto}
@media(max-width:980px){.ogrid2{grid-template-columns:minmax(0,560px);justify-content:center}}
.wood{padding:clamp(6px,1.2vw,12px);background:linear-gradient(160deg,#6b4428,#4a2c18);border-radius:14px;box-shadow:0 24px 50px -20px #000a}
.obar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.obar button{min-height:44px;border-radius:3px;border:1px solid #C4C9DC;background:transparent;color:#242942;font-weight:700;font-size:15px}
.obar button:hover{background:#D5D9E8}
.opanel{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;display:grid;gap:14px}
.osearch{position:relative}
.osearch input{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);padding:0 14px;font-size:16px;background:var(--card);color:var(--ink)}
.ores{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px -12px #0006;max-height:320px;overflow:auto;z-index:10}
.ores button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 12px;font:inherit;font-size:14px;border-bottom:1px solid var(--line)}
.ores button:hover,.ores button.on{background:var(--soft)}
.ores em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.ores small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oname2{font-size:20px;font-weight:700;line-height:1.3}
.oname2 small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.oline{display:flex;flex-wrap:wrap;gap:2px 4px;font-size:14px;align-items:center}
.oline button{border:0;background:var(--soft);color:var(--ink);border-radius:6px;padding:3px 7px;font:inherit}
.oline button.on{background:var(--acc);color:var(--accink)}
.oline em{font-style:normal;color:var(--muted)}
.otabs{display:flex;gap:6px;flex-wrap:wrap}
.eng2{font-size:14px;color:var(--muted)}.eng2 b{color:var(--ink)}
.xt{width:100%;border-collapse:collapse;font-size:14px}
.xt th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.xt td{padding:7px 8px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.xt tbody tr{cursor:pointer}.xt tbody tr:hover td{background:var(--soft)}
.xt td.sn{font-weight:700}
.xt td.nm{white-space:normal;color:var(--muted);font-size:13px;min-width:120px}
.bkt{display:inline-block;margin-left:4px;font-size:11px;padding:0 6px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:700}
.wdb{display:flex;height:16px;border-radius:4px;overflow:hidden;min-width:110px;font-size:10px;font-weight:700;line-height:16px}
.wdb i{display:block;font-style:normal;text-align:center;overflow:hidden}
.wdb .w{background:#EFF0F6;color:#242942;box-shadow:inset 0 0 0 1px #C4C9DC}.wdb .d{background:#C4C9DC;color:#242942}.wdb .l{background:#242942;color:#EFF0F6}
.tg2{font-size:14px}
.tg2 a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);text-decoration:none}
.tg2 a:hover{color:var(--acc)}
.tg2 em{font-style:normal;color:var(--muted);white-space:nowrap}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fam button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;font-weight:500}
.fam button:hover{border-color:var(--acc)}
.fam em{display:block;font-style:normal;color:var(--muted);font-size:12px;font-weight:400}
.vl button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px dashed var(--line);background:none;color:var(--ink);padding:8px 2px;font:inherit;font-size:14px}
.vl button:hover{color:var(--acc)}
.vl em{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap}
.pr{display:grid;gap:10px}
.prm{border-radius:10px;padding:12px;background:var(--soft);font-weight:500;min-height:46px}
.prm.good{color:var(--win)}.prm.bad{color:var(--loss)}.prm.go{background:transparent;border:1px solid #5C54D6;color:#5C54D6;font-weight:700}
.s8.pre::after{content:"";position:absolute;inset:0;background:#6A80B48c}
.cnt{color:var(--muted);font-size:13px}
.ont{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ostar{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ostar.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.vl button span{display:grid}.vl button small{color:var(--muted);font-size:12px}
.rg{margin-bottom:14px}.rgh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.rgh h3{margin:0;font-size:16px}
.ri{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.rl{border:0;background:none;color:var(--ink);text-align:left;padding:0;font:inherit;display:grid;gap:2px;cursor:pointer}.rl:hover b{color:var(--acc)}
.rl small{color:var(--muted);font-size:13px}
.rm{min-height:38px;border-radius:8px;border:1px solid var(--line);padding:0 10px;font-size:14px;background:var(--card);color:var(--ink)}
.ra{display:flex;flex-wrap:wrap;gap:6px}.ra .chip{min-height:32px;font-size:13px}
.oeng{border:1px solid #C4C9DC;border-radius:4px;padding:12px 14px;margin:6px 0 4px}
.oeh{display:flex;align-items:baseline;gap:10px}
.oeh b{font-family:"Inter","Pretendard",sans-serif;font-variation-settings:"opsz" 32;font-size:28px;font-weight:800;letter-spacing:-.02em}
.oevb{height:8px;background:#242942;border-radius:2px;overflow:hidden;margin:8px 0 10px}
.oevb i{display:block;height:100%;background:#EFF0F6;box-shadow:inset 0 0 0 1px #C4C9DC;transition:width .3s}
.opv{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px solid #D5D9E8;font-size:14px;line-height:1.7}
.pvs{font-family:"Inter","Pretendard",sans-serif;font-weight:800;font-feature-settings:"tnum"}
.pvm em{font-style:normal;color:#6A80B4;margin-right:2px}
.pvm button{border:0;background:none;padding:0 2px;font:inherit;color:#242942;cursor:pointer;border-radius:2px}
.pvm button:hover{background:#D5D9E8}
.oeng .cnt{margin:0}
.xsrc{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.xsrc .chips{display:flex;flex-wrap:wrap;gap:4px}
.xsrc .chip{min-height:30px;padding:0 9px;font-size:13px}
.xlogin{margin-top:8px}
.xlogin p{margin:0 0 10px;font-size:14px;color:#505A82}
.lnk{border:0;background:none;padding:0;font:inherit;color:#505A82;text-decoration:underline;cursor:pointer}
.gwrap{max-width:1240px;margin:0 auto}.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ghead h1{margin:0}.ghead .chip{min-height:38px;display:inline-flex;align-items:center;text-decoration:none}
#gal .stf{margin:18px 0 16px}#gal .scards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.m-gal #boardSec{display:none}.m-study .osearch,.m-study #oName,.m-study .otabs,.m-tree .osearch,.m-tree #oName,.m-tree .otabs{display:none}
.gsec{font-size:18px;margin:22px 0 10px}.tcrumb{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:8px;font-size:14px}.tcrumb span{color:#C4C9DC}.tcrumb .lnk{font-size:14px;color:#242942;text-decoration:none;font-weight:600;border:0;background:none;padding:0;min-height:0}.tcrumb .lnk:hover{color:#5C54D6}
.trh{display:grid;gap:2px;margin:0 0 10px}.trh b{font-size:18px}.trh small{color:#505A82;font-size:13px}.trq{margin:4px 0}.tsh{font-family:"Inter","Pretendard",sans-serif;font-size:18px!important;color:#242942!important}
.stgo{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;border:1px solid #5C54D6;border-radius:4px;padding:10px 12px;margin:0 0 12px;text-decoration:none;color:#242942}.stgo .bee{grid-row:1/3;width:24px;height:24px}.stgo span{grid-column:2;font-size:13px;color:#505A82}.stgo:hover{background:#D5D9E8}
.sttop .lnk{font-size:14px}
.onx{width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:#505A82}.onx b{color:#242942;font-family:"Inter","Pretendard",sans-serif}
.onx button{border:1px solid #C4C9DC;background:transparent;border-radius:3px;padding:4px 10px;font:inherit;font-size:13px;color:#242942;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.onx button{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.onx button.mn{border-color:#5C54D6}
#oH1 .bee{width:.8em;height:.8em;vertical-align:-.05em;margin-left:10px}.sth p{margin-top:4px}.onx button:hover{background:#D5D9E8}
.onx i{display:inline-block;width:14px;height:4px;border-radius:1px;background:#5C54D6}.onx i.br{background:#242942;opacity:.55}
.bst{border:1px solid #C4C9DC;border-radius:4px;padding:12px 14px;margin:4px 0 12px}.bsh{margin:0 0 6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.bst .xt td:first-child{color:#505A82}.bfk{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}.bfk .chip{min-height:30px;padding:0 10px;font-size:13px;font-family:"Inter","Pretendard",sans-serif}.bq{margin:0 0 4px}.bst .xlogin{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stf{display:grid;gap:6px;margin-bottom:12px}.stf .chips{display:flex;flex-wrap:wrap;gap:4px}.stf .chip{min-height:30px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;gap:2px}.stf .bee{margin:0 2px 0 0;width:16px;height:16px}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.scard{display:grid;gap:10px;align-content:start;text-align:left;border:1px solid #C4C9DC;border-radius:4px;background:transparent;padding:10px;font:inherit;color:#242942;cursor:pointer}
.scard{text-decoration:none}.scard:hover{border-color:#5C54D6}
.scard .mbd{width:100%;height:auto;aspect-ratio:1;grid-template-rows:repeat(8,1fr)}
.sct{display:grid;gap:2px}.sct b{display:flex;align-items:center;font-size:16px}.sct small{color:#505A82;font-size:12px}.sct em{font-style:normal;font-size:13px;line-height:1.5;margin:4px 0}
.sth h3{display:flex;align-items:center;margin:12px 0 2px;font-size:22px}.sth h3 .bee{width:22px;height:22px}.sth small{color:#505A82;font-size:13px}.sth p{margin:8px 0 6px;font-size:15px}
.stlist .ritem.on{background:#D5D9E8}.stlist .rt1 .bkt{vertical-align:2px;margin-left:6px}.stlist .rgo{min-height:34px}.stlist .rt1,.stlist .rt2,.stlist .rt3{grid-column:2}
@media(min-width:981px){.ogrid2>div:first-child{position:sticky;top:calc(var(--hh,64px) + 12px)}}
.onote{margin-top:10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;border:1px solid #5C54D6;border-radius:4px;padding:10px 12px;font-size:15px;line-height:1.55}
.onote>b{font-size:13px;color:#5C54D6;width:100%}.onote>b em{font-style:normal;color:#505A82;font-family:"Inter","Pretendard",sans-serif;margin-left:4px}
.onote>span{flex:1;min-width:0}.onote .lnk{font-size:13px}
</style>

<body>
<header>
  <div class="nav">
    <a class="logo" href="index.html">한 수</a>
    <nav aria-label="메뉴"><a href="puzzle.html">퍼즐</a><a href="stats.html">전적</a><a href="analysis.html">분석</a><a href="opening.html" aria-current="page">오프닝</a><a href="play.html">대국</a></nav>
  </div>
</header>
<main>
<section class="band ob" id="galSec" hidden>
  <div class="gwrap"><div class="ghead"><h1>오프닝</h1><a class="chip" href="opening.html?explore=1">자유 탐색</a></div><div id="gal"></div></div>
</section>
<section class="band ob" id="boardSec">
  <div class="ogrid2">
    <div>
      <h1 id="oH1">오프닝</h1>
      <div class="cbar" id="oCapT"></div><div class="wood"><div class="aboard"><div class="ab8" id="ob8" aria-label="오프닝 보드"></div><svg class="amarks" id="omarks" viewBox="0 0 8 8" aria-hidden="true"></svg><div class="apromo" id="opromo"><div id="opromoRow"></div></div></div></div>
      <div class="cbar" id="oCapB"></div>
      <div class="obar"><button id="bStart" aria-label="처음">처음</button><button id="bBack" aria-label="뒤로">이전</button><button id="bFwd" aria-label="앞으로">다음</button><button id="bFlip" aria-label="뒤집기">뒤집기</button></div>
      <div class="onote" id="oNote" hidden></div>
    </div>
    <div class="opanel">
      <div class="sttop" id="stTop"></div>
      <div class="osearch"><input id="oq" placeholder="오프닝 이름이나 ECO 코드 (예: Sicilian, B90)" autocomplete="off" spellcheck="false" aria-label="오프닝 검색"><div class="ores" id="ores" hidden></div></div>
      <div class="oname2" id="oName"></div>
      <div class="oline" id="oLine"></div>
      <div class="oeng" id="oEng"></div>
      <div class="otabs" role="tablist"><button class="tab" data-t="ex" aria-selected="true">수 통계</button><button class="tab" data-t="games" aria-selected="false">대표 게임</button><button class="tab" data-t="drill" aria-selected="false">연습</button><button class="tab" data-t="saved" aria-selected="false">저장</button></div>
      <div id="tEx"></div>
      <div id="tGames" hidden></div>
      <div id="tList" hidden></div>
      <div id="tDrill" hidden></div>
      <div id="tSaved" hidden></div>
      <div id="tStudy" hidden></div>
    </div>
  </div>
</section>
</main>
<footer class="band">
  <div class="wrap">
    <p><b>한 수</b></p>
    <p>수 통계 Lichess 마스터 데이터베이스 · 오프닝 이름 lichess-org/chess-openings (CC0) · 엔진 Stockfish (GPLv3) · 기물 cburnett (CC BY-SA 3.0)</p>
  </div>
</footer>
