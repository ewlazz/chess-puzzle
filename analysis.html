<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>분석 - 한 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pieces.css">
<link rel="stylesheet" href="css/site.css">
<style>
.top .tabs{margin-bottom:16px}
.top .tab{background:transparent;color:#d4e2e6;border-color:#ffffff33}
.top .tab[aria-selected=true]{background:#fff;color:#122027;border-color:#fff}
.paste{display:grid;gap:10px;max-width:760px}
.paste textarea{width:100%;min-height:180px;border-radius:12px;border:0;padding:14px 16px;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fff;color:#122027;resize:vertical}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pbtn{min-height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--acc);color:var(--accink);font-weight:700}
.sbtn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #ffffff40;background:transparent;color:#e7eef0;font-weight:500}
.sbtn:hover{background:#ffffff14}
.hint2{color:#b9ced4;font-size:14px;margin:0}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,520px) minmax(0,360px);gap:24px;align-items:start}
@media(max-width:900px){.ed{grid-template-columns:minmax(0,520px)}}
.ebox{background:linear-gradient(160deg,#6b4428,#4a2c18);padding:10px;border-radius:14px}
.eb8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;border-radius:4px;overflow:hidden;touch-action:none;user-select:none}
.eb8 .s8{cursor:pointer}
.pal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.pal button{aspect-ratio:1;border-radius:10px;border:2px solid transparent;background:#ffffff1a;position:relative;padding:0}
.pal button[aria-pressed=true]{border-color:var(--acc);background:#ffffff33}
.pal .pc{position:absolute;inset:8%;background-size:100% 100%}
.pal .er{color:#fff;font-size:20px;font-weight:700}
.eside{display:grid;gap:14px;color:#e7eef0}
.eside h3{margin:0 0 6px;font-size:15px;color:#b9ced4;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid #ffffff40;background:transparent;color:#e7eef0;font-weight:500}
.seg button[aria-pressed=true]{background:#fff;color:#122027;border-color:#fff}
.cks{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:15px}
.cks label{display:flex;align-items:center;gap:8px;min-height:32px}
.cks input{width:18px;height:18px;accent-color:var(--acc)}
.fen{width:100%;min-height:44px;border-radius:10px;border:0;padding:0 12px;font:14px ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#122027}
.err{color:#ffd2c2;font-size:14px;min-height:1.4em;margin:0}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e3b4a">
<link rel="apple-touch-icon" href="icons/app/apple-180.png">
<script src="js/theme.js"></script>
</head>
<body>
<header>
  <div class="nav">
    <a class="logo" href="index.html"><span>♞</span>한 수</a>
    <nav aria-label="메뉴"><a href="index.html">퍼즐</a><a href="index.html#list">목록</a><a href="stats.html">전적</a><a href="analysis.html" aria-current="page">분석</a><a href="play.html">대국</a></nav>
  </div>
</header>
<main>
<section class="band top">
  <div class="wrap">
    <h1>분석</h1>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="paste" aria-selected="true">PGN · FEN</button><button class="tab" role="tab" data-t="edit" aria-selected="false">보드 에디터</button></div>
    <div id="tPaste" class="paste">
      <textarea id="pgn" spellcheck="false" placeholder="PGN, FEN 또는 리체스 게임 링크"></textarea>
      <div class="prow"><button class="pbtn" id="go">분석</button><button class="sbtn" id="toEdit">에디터로 열기</button></div>
      <p class="msg" id="msg"></p>
    </div>
    <div id="tEdit" class="ed" hidden>
      <div>
        <div class="ebox"><div class="eb8" id="eb8" aria-label="보드 에디터"></div></div>
        <div class="pal" id="pal"></div>
      </div>
      <div class="eside">
        <div><h3>차례</h3><div class="seg" id="eTurn"><button data-v="w" aria-pressed="true">백</button><button data-v="b" aria-pressed="false">흑</button></div></div>
        <div><h3>캐슬링</h3><div class="cks">
          <label><input type="checkbox" id="cK" checked>백 O-O</label><label><input type="checkbox" id="cQ" checked>백 O-O-O</label>
          <label><input type="checkbox" id="ck" checked>흑 O-O</label><label><input type="checkbox" id="cq" checked>흑 O-O-O</label></div></div>
        <div><h3>FEN</h3><input class="fen" id="eFen" spellcheck="false" aria-label="FEN"></div>
        <div class="seg"><button id="eStart">시작 위치</button><button id="eClear">비우기</button><button id="eFlip">뒤집기</button></div>
        <p class="err" id="eErr"></p>
        <div class="prow"><button class="pbtn" id="eGo">분석</button></div>
      </div>
    </div>
  </div>
</section>
</main>
<footer class="band">
  <div class="wrap">
    <p><b>한 수</b></p>
    <p>엔진 Stockfish (GPLv3) · 기물 cburnett (CC BY-SA 3.0)</p>
  </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="js/common.js"></script>
<script src="js/openings.js"></script>
<script src="js/analysis.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
