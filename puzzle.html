<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>퍼즐 - 한 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pieces.css">
<style>
/* VOICE: 체스 클럽 퍼즐 카드 — 차분하고 집중되는, 한 수에 몰입
   IDEA: 체스 책의 "백 차례, 이길 수를 찾아라" 퍼즐 카드와 기보지
   PICTURE: 실제로 둘 수 있는 큰 나무 보드가 첫 화면의 주인공
   COLOUR and TYPE: 깊은 페트롤 블루 바탕 + 나무색 보드 + 코랄 강조 / Black Han Sans + IBM Plex Sans KR
   LAYOUT: 보드 왼쪽, 기보지 카드 오른쪽 → 600px 이하에서 세로로 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1519);--ink:light-dark(#242942,#242942);--band:light-dark(#EFF0F6,#0a2a35);--card:light-dark(#ffffff,#10252d);--soft:light-dark(#D5D9E8,#132d36);--line:light-dark(#C4C9DC,#24404a);--muted:light-dark(#505A82,#6A80B4);--acc:#5C54D6;--accink:#EFF0F6;--lsq:#f0d9b5;--dsq:#b58863;--good:light-dark(#16794d,#5fd39b);--bad:light-dark(#c4302b,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Pretendard",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.logo{font-family:"Pretendard",sans-serif;font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(28px,4vw,40px)}
/* header */
header{background:var(--band);color:#242942;position:sticky;top:0;z-index:20;border-bottom:1px solid #D5D9E8}
.nav{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px max(5vw,16px)}
.logo{font-size:26px;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--acc);color:var(--accink);font-size:20px}
.nav nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.nav nav a{text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:500;font-size:15px;color:#505A82}
.nav nav a:hover{background:#D5D9E8;color:#fff}
/* hero / play */
.play{background:var(--band);color:#242942;padding-top:clamp(20px,3vw,40px)}
.play .head{max-width:1000px;margin:0 auto 20px}
.play h1{font-size:clamp(32px,4.6vw,52px)}
.play .head p{margin:0;color:#505A82;max-width:46ch}
.grid{display:grid;grid-template-columns:minmax(0,580px) minmax(0,380px);gap:clamp(20px,3vw,40px);justify-content:center;align-items:start}
.boardbox{position:relative;padding:clamp(6px,1.2vw,12px);background:linear-gradient(160deg,#6b4428,#4a2c18);border-radius:14px;box-shadow:0 24px 50px -20px #000a,inset 0 1px 0 #C4C9DC}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;width:100%;border-radius:4px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative;aspect-ratio:1;background:var(--lsq)}
.sq.d{background:var(--dsq)}
.sq.last::after,.sq.pre::after,.sq.sel::after,.sq.hint::after,.sq.chk::after,.sq.bad::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::after{background:#5C54D640}
.sq.sel::after{background:#5C54D640}
.sq.pre::after{background:#6A80B48c}
.sq.hov::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px #5C54D6;z-index:4;pointer-events:none}
.sq.own{cursor:grab}body.grabbing,body.grabbing *{cursor:grabbing!important}
.bwrap{position:relative}
.marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.mk{position:absolute;inset:0;opacity:.8;z-index:1;pointer-events:none}
.sq.hint::after{box-shadow:inset 0 0 0 5px var(--acc);animation:pulse 1s ease-in-out infinite alternate}
.sq.chk::after{background:radial-gradient(circle,#ff2b2bcc 0,#ff2b2b55 45%,transparent 72%)}
.sq.bad::after{background:#24294299}
.pc{position:absolute;inset:0;background-size:100% 100%;pointer-events:none;z-index:2;will-change:transform}
.pc.ghost{opacity:.35}
.pc.float{position:fixed;left:0;top:0;right:auto;bottom:auto;z-index:1000;filter:drop-shadow(0 6px 8px #0006)}
.dot{position:absolute;inset:36%;border-radius:50%;background:#2429424d;z-index:3;pointer-events:none}
.cap{position:absolute;inset:3%;border-radius:50%;border:5px solid #2429424d;z-index:3;pointer-events:none}
.co{position:absolute;font-size:clamp(9px,1.4vw,12px);font-weight:700;line-height:1;pointer-events:none;z-index:1}
.co.r{top:4px;left:4px}.co.f{bottom:3px;right:5px}
.sq.l .co{color:var(--dsq)}.sq.d .co{color:var(--lsq)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{to{box-shadow:inset 0 0 0 2px var(--acc)}}
.promo{position:absolute;inset:0;display:none;place-items:center;background:#EFF0F6e6;border-radius:14px;z-index:30}
.promo.on{display:grid}
.promo div{background:var(--card);color:var(--ink);padding:16px;border-radius:12px;text-align:center}
.promo p{margin:0 0 10px;font-weight:700}
.promo .row{display:flex;gap:8px}
.promo button{width:64px;height:64px;border:1px solid var(--line);border-radius:10px;background:var(--soft);position:relative}
.promo button .pc{inset:6px}
/* score card */
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:clamp(18px,2.2vw,26px);box-shadow:0 24px 50px -24px #000a}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--ink);font-weight:500;font-size:13px;white-space:nowrap}
.snd{margin-left:auto;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;font-size:13px}
.snd[aria-pressed=false]{color:var(--muted);text-decoration:line-through}
.tag.acc{background:var(--acc);color:var(--accink)}
.card h3{font-family:"Pretendard",sans-serif;font-weight:400;font-size:32px;line-height:1.1;margin:10px 0 4px}
.turn{display:flex;align-items:center;gap:10px;font-weight:700;margin:12px 0}
.turn i{width:22px;height:22px;border-radius:50%;border:2px solid #556;flex:none}
.turn i.w{background:#fff}.turn i.b{background:#111}
.status{border-radius:10px;padding:12px 14px;background:var(--soft);font-weight:500;min-height:50px;display:flex;align-items:center;gap:10px;border-left:5px solid var(--muted)}
.status:empty,.log:empty{display:none}
.status.good,.status.win{border-color:var(--good)}.status.win{color:var(--good);font-weight:700}
.status.wrong{border-color:var(--bad);color:var(--bad)}
.status.hint{border-color:var(--acc)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;padding:8px 12px}
.btn:hover{background:var(--soft)}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--accink);grid-column:1/-1}
.btn.main:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.log{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;padding:10px 0;border-top:1px dashed var(--line);font-size:15px}
.log span{padding:2px 8px;border-radius:6px;background:var(--soft);white-space:nowrap}
.log span.u{background:#5C54D626}
.log em{color:var(--muted);font-style:normal}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;text-align:center}
.stats div{background:var(--soft);border-radius:10px;padding:8px 4px}
.stats b{display:block;font-size:24px;line-height:1.2}
.stats small{font-size:13px;color:var(--muted)}
.keys{font-size:14px;color:#505A82;margin:18px auto 0;text-align:center;max-width:820px}
.note{font-size:13px;color:#6A80B4;margin:8px 0 0;text-align:center}
/* list */
[hidden]{display:none!important}
/* 보드 색 설정 */
.setb{display:inline-grid;place-items:center;min-width:44px;min-height:40px;border-radius:8px;border:0;background:transparent;cursor:pointer}
.setb:hover{background:#D5D9E8}
.sw{display:inline-grid;grid-template-columns:1fr 1fr;width:20px;height:20px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px #C4C9DC;vertical-align:middle}
.sw i{display:block;background:var(--a,var(--lsq))}.sw i:nth-child(2),.sw i:nth-child(3){background:var(--b,var(--dsq))}
.setp{position:absolute;right:max(5vw,16px);top:100%;margin-top:6px;background:#fff;color:#242942;border-radius:12px;padding:12px;box-shadow:0 16px 40px -12px #000a;z-index:60;width:min(320px,calc(100vw - 32px))}
.setp p{margin:0 0 8px;font-weight:700;font-size:14px}
.sws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sws button{display:flex;align-items:center;gap:8px;min-height:40px;border-radius:9px;border:1px solid #C4C9DC;background:#fff;color:#242942;font:inherit;font-size:14px;padding:0 8px}
.sws button[aria-pressed=true]{border-color:#5C54D6;box-shadow:0 0 0 2px #5C54D640}
.sws .sw{width:22px;height:22px;box-shadow:none}


.rov{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:#EFF0F6e6;border-radius:14px;text-align:center;color:#fff;padding:16px}
.rov h3{margin:0 0 4px;font-family:"Pretendard",sans-serif;font-weight:400;font-size:34px}
.rov p{margin:0 0 16px;color:#505A82}
.rov .rbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rov .rbs button{min-width:96px;min-height:56px;border-radius:12px;border:0;background:var(--acc);color:var(--accink);font-weight:700;font-size:18px;line-height:1.2}
.rov .rbs button small{display:block;font-size:12px;font-weight:500;opacity:.8}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.modes button{min-height:42px;padding:0 16px;border-radius:99px;border:1px solid #C4C9DC;background:transparent;color:#242942;font-weight:700}
.modes button[aria-selected=true]{background:#fff;color:#242942;border-color:#fff}
.tsel{margin-top:10px;min-height:42px;border-radius:10px;border:0;padding:0 12px;font-size:15px;background:#fff;color:#242942}
.psrc{font-size:13px;color:var(--muted)}
.rush{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
.rush .rb{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--acc);color:var(--accink);font-weight:700}
.rush .rt{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:auto}
.rush .rs{font-size:13px;color:var(--muted);width:100%}
.rush .x{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--muted);font-weight:800;font-size:13px}
.rush .x.on{background:var(--bad);color:#fff}
.htab{width:100%;border-collapse:collapse;font-size:14px}
.htab td{padding:8px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.htab td.up{color:var(--good);font-weight:700}.htab td.dn{color:var(--bad);font-weight:700}
.pz .del{float:right;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.lhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.lhead p{margin:6px 0 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pz{display:block;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);transition:transform .15s,box-shadow .15s}
.pz:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px #0007}
.pz.cur{outline:3px solid var(--acc)}
.mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;border-radius:6px;overflow:hidden;margin-bottom:10px}
.mini div{position:relative;background:var(--lsq)}.mini div.d{background:var(--dsq)}
.pz b{display:block;font-size:17px}
.pz .meta{margin-top:4px;font-size:13px}
.ok{width:18px;height:18px;vertical-align:-4px;margin-left:6px}
.badge.t0{top:0}.badge.r0{right:0}
.badge{position:absolute;top:-10%;right:-10%;width:44%;height:44%;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 2px #0006);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.sti{width:24px;height:24px;flex:none}
/* themes */
.themes{background:var(--soft)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:22px}
.tgrid article{background:var(--card);border-radius:14px;padding:20px;border-top:4px solid var(--dsq)}
.tgrid h3{margin:0 0 6px;font-size:19px}
.tgrid p{margin:0;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px;margin-top:22px;padding:0;list-style:none;counter-reset:s}
.how li{padding-left:52px;position:relative}
.how li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-weight:700}
.how b{display:block;font-size:18px}
.how p{margin:2px 0 0;color:var(--muted)}
footer{background:var(--band);color:#505A82;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer p{margin:0}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,560px);}}
@media(max-width:600px){.nav nav{margin-left:0;width:100%}.nav nav a{padding:8px 10px}.card h3{font-size:26px}.plist{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pz{padding:8px}.pz b{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.wbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.wtag{font-size:12px;font-weight:700;border:1px solid #C4C9DC;border-radius:2px;padding:2px 6px;color:#505A82}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFF0F6">
<link rel="apple-touch-icon" href="icons/app/apple-180.png">
<script src="js/theme.js"></script>

</head>
<body>
<header>
  <div class="nav">
    <a class="logo" href="index.html">한 수</a>
    <nav aria-label="메뉴"><a href="puzzle.html" aria-current="page">퍼즐</a><a href="stats.html">전적</a><a href="analysis.html">분석</a><a href="opening.html">오프닝</a><a href="play.html">대국</a></nav>
  </div>
</header>

<main>
<section class="band play" id="play">
  <div class="wrap">
    <div class="head">
      <h1>퍼즐</h1>
      <div class="modes" id="modes" role="tablist"><button data-m="basic">기본</button><button data-m="daily">오늘</button><button data-m="rated">추천</button><button data-m="theme">테마</button><button data-m="weak">약점</button><button data-m="rush">러시</button><button data-m="mine">내 실수</button></div>
      <select class="tsel" id="themeSel" aria-label="테마" hidden></select><div class="wbar" id="weakBar" hidden></div>
    </div>
    <div class="grid">
      <div class="boardbox" id="boardbox">
        <div class="bwrap"><div class="board" id="board" role="grid" aria-label="체스 보드"></div><svg class="marks" id="marks" viewBox="0 0 8 8" aria-hidden="true"></svg></div>
        <div class="rov" id="rov" hidden></div>
        <div class="promo" id="promo" role="dialog" aria-label="승진"><div><p>승진</p><div class="row" id="promoRow"></div></div></div>
      </div>
      <aside class="card" aria-live="polite">
        <div class="meta"><span id="pnum">1 / 12</span><span class="tag" id="plevel">쉬움</span><a class="psrc" id="psrc" target="_blank" rel="noopener" hidden>리체스</a><button class="snd" id="bAna">분석</button><button class="snd" id="bSound" aria-pressed="true">소리 켬</button></div>
        <div class="rush" id="rushBar" hidden></div>
        <h3 id="ptitle">백랭크 메이트</h3>
        <div class="turn"><i id="tdot" class="w"></i><span id="tgoal">백 차례 · 1수 메이트</span></div>
        <div class="status" id="status"></div>
        <div class="btns">
          <button class="btn" id="bHint">힌트</button>
          <button class="btn" id="bShow">정답</button>
          <button class="btn" id="bReset">다시</button>
          <button class="btn" id="bPrev">이전</button>
          <button class="btn main" id="bNext">다음</button>
        </div>
        <div class="log" id="log"></div>
        <div class="stats">
          <div><b id="sSolved">0</b><small id="l1">푼 퍼즐</small></div>
          <div><b id="sStreak">0</b><small id="l2">연속</small></div>
          <div><b id="sBest">0</b><small id="l3">최고</small></div>
        </div>
      </aside>
    </div>
  </div>
</section>

<section class="band" id="list">
  <div class="wrap">
    <div class="lhead">
      <h2 id="lTitle">목록</h2>
      <div class="chips" id="fchips" role="group" aria-label="퍼즐 필터">
        <button class="chip" data-f="all" aria-pressed="true">전체</button>
        <button class="chip" data-f="mate" aria-pressed="false">메이트</button>
        <button class="chip" data-f="win" aria-pressed="false">전술</button>
        <button class="chip" data-f="todo" aria-pressed="false">안 푼 것</button>
      </div>
    </div>
    <div class="plist" id="plist"></div>
  </div>
</section>

</main>

<footer class="band">
  <div class="wrap">
    <p><b>한 수</b></p>
    <p>기물 cburnett (CC BY-SA 3.0) · chess.js</p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
{
const PUZ=[
 {fen:"6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1",sol:["Rd8#"],title:"백랭크 메이트",theme:"메이트",kind:"mate",goal:"1수 메이트",lv:"쉬움"},
 {fen:"6k1/R7/8/8/8/8/8/1R4K1 w - - 0 1",sol:["Rb8#"],title:"룩 두 개 메이트",theme:"메이트",kind:"mate",goal:"1수 메이트",lv:"쉬움"},

  if(to===d.from&&d.wasSel&&!d.moved)sel=null;
  render();
});
boardEl.addEventListener("pointercancel",()=>{drag=rdrag=null;endFloat();render()});
$("#bHint").onclick=()=>{if(phase!=="idle")return;if(mode!=="basic")failed=true;const t=new Chess(g.fen()),m=t.move(P().sol[ply]);hintSq=m.from;sel=null;render();setStatus("hint","힌트")};
$("#bShow").onclick=()=>{
  if(phase==="done"||phase==="show"||phase==="cont")return;
  clearTimeout(timer);
  if(phase==="wrong"){g.undo();last=null;badSq=null}
  bdg=null;
  $("#promo").classList.remove("on");
  shown=true;phase="show";sel=hintSq=premove=null;
  if(mode==="basic"&&store.streak){store.streak=0;save();stats()}
  if(((mode==="rated"||mode==="theme"||mode==="weak"))&&!CP._rated)rate(false);
  setStatus("hint","정답: "+P().sol.join(" "));
  const step=()=>{if(ply>=P().sol.length){finish();return}const r=g.move(P().sol[ply]);last={from:r.from,to:r.to};bdg=r.color===orient?{sq:r.to,ic:"best"}:null;ply++;play(moveSound(r),0,r.color!==orient);render();animate(r.from,r.to);timer=setTimeout(step,750)};
  render();timer=setTimeout(step,300);
};
$("#bAna").onclick=()=>{if(!CP)return;const t=new Chess(P().fen),mv=g.history();
  const pgn=`[SetUp "1"]\n[FEN "${P().fen}"]\n[White "${orient==="w"?"나":"상대"}"]\n[Black "${orient==="b"?"나":"상대"}"]\n\n`+mv.join(" ");
  window.open(`analysis.html?pgn=${encodeURIComponent(pgn)}&me=${orient}&ply=0&t=${encodeURIComponent(P().title||"퍼즐")}`,"_blank")};
$("#bReset").onclick=()=>{if(mode==="basic")load(cur);else if(mode!=="rush"){const r=CP._rated;start(CP,lastInfo);CP._rated=r}};
$("#bPrev").onclick=()=>{if(mode==="basic")load(cur-1);else if(mode==="mine")loadMine(mi-1)};
$("#bNext").onclick=()=>{if(mode==="basic")load(cur+1);else if(mode==="mine")loadMine(mi+1);else if((mode==="rated"||mode==="theme"||mode==="weak"))nextRated()};
function mini(p){
  const t=new Chess(p.fen),o=t.turn();
  return order(o).map(sq=>{const q=t.get(sq);return `<div class="${isDark(sq)?"d":""}">${q?`<i class="pc ${q.color}${q.type}"></i>`:""}</div>`}).join("");
}
const minis=PUZ.map(mini);
function renderList(){
  if((mode==="rated"||mode==="theme"||mode==="weak")||mode==="daily"){$("#plist").innerHTML=rs.hist.length?`<table class="htab">${rs.hist.map(h=>`<tr><td>${h.url?`<a href="${h.url}" target="_blank" rel="noopener">${h.t}</a>`:h.t}</td><td>${h.r}</td><td>${h.w?"성공":"실패"}</td><td class="${h.d>=0?"up":"dn"}">${sgn(h.d)}</td></tr>`).join("")}</table>`:"<p>아직 기록이 없어요.</p>";return}
  if(mode==="rush"){$("#plist").innerHTML="<p>"+[["180","3분"],["300","5분"],["0","생존"]].map(([k,l])=>`${l} 최고 ${rushBest[k]||0}점`).join(" · ")+"</p>";return}
  if(mode==="mine"){const L=myList();$("#plist").innerHTML=L.map((p,i)=>`<a class="pz${i===mi?" cur":""}" href="#mine" data-mi="${i}"><div class="mini" aria-hidden="true">${mini(p)}</div><b>${p.title}<button class="del" data-del="${i}" aria-label="삭제">삭제</button></b><div class="meta"><span>${p.goal}</span>${p.solved?icon("correct","ok"):""}</div></a>`).join("")||"<p>아직 없어요.</p>";return}
  $("#plist").innerHTML=PUZ.map((p,i)=>{
    const solved=store.solved.includes(i);
    if(filter==="mate"&&p.kind!=="mate"||filter==="win"&&p.kind!=="win"||filter==="todo"&&solved)return "";
    return `<a class="pz${i===cur?" cur":""}" href="#p${i+1}"><div class="mini" aria-hidden="true">${minis[i]}</div><b>${i+1}. ${p.title}</b><div class="meta"><span>${p.fen.split(" ")[1]==="w"?"백":"흑"} · ${p.goal}</span>${solved?icon("correct","ok"):""}</div></a>`;
  }).join("")||'<p>없음</p>';
}
document.querySelectorAll("#fchips .chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("#fchips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()});
$("#plist").addEventListener("click",e=>{
  const d=e.target.closest("[data-del]");if(d){e.preventDefault();e.stopPropagation();const L=myList();L.splice(+d.dataset.del,1);saveMy(L);if(mi>=L.length)mi=0;loadMine(mi);return}
  const a=e.target.closest("[data-mi]");if(a){e.preventDefault();loadMine(+a.dataset.mi);document.getElementById("play").scrollIntoView()}
});
const fromHash=()=>{
  const h=location.hash.slice(1);
  if(["daily","rated","theme","weak","rush","mine"].includes(h)){if(mode!==h||!g)setMode(h);return true}
  const m=/^p(\d+)$/.exec(h);if(m){const i=+m[1]-1;if(i>=0&&i<N){if(i!==cur||!g||mode!=="basic")load(i,true);document.getElementById("play").scrollIntoView();return true}}return false};
window.addEventListener("hashchange",fromHash);
stats();soundBtn();
document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m==="basic"));
{const th=new URL(location.href).searchParams.get("theme");if(th&&THEMES.includes(th)){$("#themeSel").value=th;try{localStorage.setItem("hansu-theme",th)}catch(e){}}}
if(!fromHash())load(0);
booted=true;
}
</script>
</body>
