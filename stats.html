<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전적 - 한 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pieces.css">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1519);--ink:light-dark(#122027,#e7eef0);--band:light-dark(#0e3b4a,#0a2a35);--card:light-dark(#ffffff,#10252d);--soft:light-dark(#eef3f4,#132d36);--line:light-dark(#d9e2e5,#24404a);--muted:light-dark(#53656c,#9fb4bb);--acc:#ff6a3d;--accink:#3a1205;--lsq:#f0d9b5;--dsq:#b58863;--win:light-dark(#2f8f4e,#5fd39b);--loss:light-dark(#c8423b,#ff8a80);--draw:light-dark(#8a979c,#9fb4bb)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,.logo{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;line-height:1.05;margin:0}
h2{font-size:clamp(26px,3.4vw,34px)}
.band{padding:clamp(24px,3.5vw,52px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--band);color:#f3f7f8;position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff1a}
.nav{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px max(5vw,16px)}
.logo{font-size:26px;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--acc);color:var(--accink);font-size:20px}
.nav nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.nav nav a{text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:500;font-size:15px;color:#d4e2e6}
.nav nav a:hover,.nav nav a[aria-current]{background:#ffffff14;color:#fff}
/* top */
.top{background:var(--band);color:#f3f7f8}
.top h1{font-size:clamp(32px,4.6vw,48px);margin-bottom:18px}
.search{display:flex;gap:8px;max-width:560px}
.search input{flex:1;min-height:50px;border-radius:12px;border:0;padding:0 16px;font-size:17px;background:#fff;color:#122027}
.search button{min-height:50px;padding:0 22px;border-radius:12px;border:0;background:var(--acc);color:var(--accink);font-weight:700}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.recent button{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid #ffffff33;background:transparent;color:#d4e2e6;font-size:14px}
.msg{margin:14px 0 0;color:#ffd2c2;min-height:1.5em}
.prof{display:none;margin-top:28px;gap:6px 18px;align-items:center;grid-template-columns:auto minmax(0,1fr) auto}
.prof.on{display:grid}
.prof img{width:84px;height:84px;border-radius:14px;background:#ffffff1a;object-fit:cover}
.prof .nm{font-size:28px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl{background:#c8423b;color:#fff;font-size:14px;padding:1px 7px;border-radius:5px}
.prof .sub{color:#b9ced4;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 14px}
.prof a.ext{margin-left:auto;color:#d4e2e6;font-size:14px}
.rates{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.rates.on{display:grid}
.rc{background:var(--card);color:var(--ink);border-radius:14px;padding:16px}
.rc.off{opacity:.55}
.rc small{color:var(--muted);font-size:14px}
.rc b{display:block;font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums}
.rc .best{font-size:13px;color:var(--muted)}
.wdl{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft);margin:10px 0 6px}
.wdl i{display:block;height:100%}.wdl .w{background:var(--win)}.wdl .d{background:var(--draw)}.wdl .l{background:var(--loss)}
.rc .nums{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* body */
.main{display:none}.main.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabs,.chips{display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.range{color:var(--muted);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px}
/* games */
.glist{display:grid;gap:6px}
.gr{display:grid;grid-template-columns:44px 92px minmax(0,1.4fr) 92px minmax(0,1.3fr) 86px 74px 64px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px}
.gr:hover{border-color:var(--muted)}
.res{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;font-weight:700;color:#fff}
.res.win{background:var(--win)}.res.loss{background:var(--loss)}.res.draw{background:var(--draw)}
.tcx{color:var(--muted);white-space:nowrap}
.pl{display:grid;gap:2px}
.pl span{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl i{width:11px;height:11px;border-radius:50%;border:1.5px solid #667;flex:none}.pl i.w{background:#fff}.pl i.b{background:#111}
.pl em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.pl .me{font-weight:700}
.op{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc{font-variant-numeric:tabular-nums;white-space:nowrap}.acc em{font-style:normal;color:var(--muted)}
.dt{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ab{min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-weight:700;font-size:13px}
.ab:hover{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.more{display:block;margin:14px auto 0;min-height:44px;padding:0 24px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.empty{color:var(--muted);padding:24px 0}
@media(max-width:900px){.gr{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"r p a" "r m m"}.gr .res{grid-area:r}.gr .pl{grid-area:p}.gr .ab{grid-area:a;padding:0 12px}.gr .mline{grid-area:m;display:flex;flex-wrap:wrap;gap:2px 12px}.gr>.tcx,.gr>.how,.gr>.op,.gr>.acc,.gr>.dt{display:none}}
@media(min-width:901px){.gr .mline{display:none}}
.mline span{color:var(--muted);font-size:13px;white-space:nowrap}
/* stats */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.sc{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card)}
.sc.full{grid-column:1/-1}
.sc h3{margin:0 0 12px;font-size:17px}
.big{display:flex;flex-wrap:wrap;gap:8px 28px}
.big div b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.big div small{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n em{font-style:normal;color:var(--muted);margin-left:6px;font-size:13px}
.row .wdl{margin:0}
.row .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.hb .t{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.hb .t i{display:block;height:100%;border-radius:99px}
.hb span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two .hb{grid-template-columns:64px minmax(0,1fr) 28px;gap:8px}
@media(max-width:520px){.two{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) 80px 46px}}
.sub3{color:var(--muted);font-size:13px;margin:0 0 6px}
.fig{position:relative;height:260px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
/* analysis */
.ana{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none}
.ana.on{display:block}
.ahead{position:sticky;top:0;z-index:5;background:var(--band);color:#f3f7f8;display:flex;align-items:center;gap:12px;padding:10px max(3vw,14px)}
.ahead b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahead a{color:#b9ced4;font-size:14px;white-space:nowrap}
.ahead .x{margin-left:auto;min-height:40px;min-width:40px;border-radius:10px;border:1px solid #ffffff33;background:transparent;color:#fff;font-size:20px}
.alay{max-width:1240px;margin:0 auto;padding:18px max(3vw,14px) 40px;display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:960px){.alay{grid-template-columns:minmax(0,600px);justify-content:center}}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;padding:6px 2px}
.who em{font-style:normal;color:var(--muted);font-weight:400}
.clk{font-variant-numeric:tabular-nums;background:var(--soft);padding:3px 10px;border-radius:7px;font-weight:700}
.bwrap2{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.evb{position:relative;border-radius:5px;overflow:hidden;background:#2b2b2b}
.evb i{position:absolute;left:0;right:0;bottom:0;background:#f2f2f2;transition:height .25s}
.evb.flip i{bottom:auto;top:0}
.evb span{position:absolute;left:0;right:0;font-size:10px;font-weight:700;text-align:center;z-index:2}
.aboard{position:relative}
.ab8{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;border-radius:4px;overflow:hidden}
.s8{position:relative;background:var(--lsq)}.s8.d{background:var(--dsq)}
.s8.lm::after{content:"";position:absolute;inset:0;background:#f7ec5f73}
.s8 .pc{position:absolute;inset:0;background-size:100% 100%;z-index:2}
.s8 .co{position:absolute;font-size:11px;font-weight:700;line-height:1;z-index:1}.s8 .co.r{top:3px;left:3px}.s8 .co.f{bottom:2px;right:4px}
.s8.l .co{color:var(--dsq)}.s8.d .co{color:var(--lsq)}
.badge{position:absolute;top:-8%;right:-8%;width:42%;height:42%;border-radius:50%;z-index:4;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(10px,1.6vw,15px);box-shadow:0 2px 4px #0005;border:2px solid #fff}
.amarks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.ctl button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:700}
.ctl button:hover{background:var(--soft)}
.side{display:grid;gap:14px}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.ast{font-size:14px;color:var(--muted);margin:6px 0 0}
.acc2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc2 div{background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.acc2 b{display:block;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.acc2 small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls{width:100%;border-collapse:collapse;font-size:14px}
.cls td{padding:5px 4px;border-bottom:1px dashed var(--line)}
.cls td:nth-child(2),.cls td:nth-child(3){text-align:center;font-weight:700;font-variant-numeric:tabular-nums;width:22%}
.cls tr:last-child td{border-bottom:0}
.dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;margin-right:8px;vertical-align:middle}
.cur{background:var(--soft);border-radius:12px;padding:12px;font-size:14px}
.cur b{font-size:16px}
.cur p{margin:4px 0 0;color:var(--muted);overflow-wrap:anywhere}
.mlist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;font-size:14px}
.mrow{display:grid;grid-template-columns:40px 1fr 1fr;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow>span{padding:6px 8px;color:var(--muted);background:var(--soft);font-variant-numeric:tabular-nums}
.mv{border:0;background:transparent;color:var(--ink);text-align:left;padding:6px 8px;display:flex;align-items:center;gap:6px;min-height:34px}
.mv:hover{background:var(--soft)}
.mv.on{background:var(--acc);color:var(--accink)}
.mv i{width:16px;height:16px;border-radius:50%;flex:none;font-style:normal;font-size:9px;color:#fff;display:grid;place-items:center;font-weight:800}
.gfig{position:relative;height:120px;margin-top:14px;border-radius:10px;overflow:hidden;background:#2b2b2b;cursor:pointer}
.gfig svg{position:absolute;inset:0;width:100%;height:100%}
footer{background:var(--band);color:#b9ced4;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}footer p{margin:0}
@media(max-width:600px){.nav nav{margin-left:0;width:100%}.search button{padding:0 16px}.prof{grid-template-columns:64px minmax(0,1fr)}.prof img{width:64px;height:64px}.prof .nm{font-size:22px}.prof a.ext{grid-column:2;justify-self:start}.rc{padding:14px}.rc b{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="logo" href="index.html"><span>♞</span>한 수</a>
    <nav aria-label="메뉴"><a href="index.html">퍼즐</a><a href="index.html#list">목록</a><a href="stats.html" aria-current="page">전적</a></nav>
  </div>
</header>
<main>
<section class="band top">
  <div class="wrap">
    <h1>전적</h1>
    <form class="search" id="form"><input id="q" placeholder="체스닷컴 닉네임" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="체스닷컴 닉네임"><button>검색</button></form>
    <div class="recent" id="recent"></div>
    <p class="msg" id="msg"></p>
    <div class="prof" id="prof"></div>
    <div class="rates" id="rates"></div>
  </div>
</section>
<section class="band main" id="main">
  <div class="wrap">
    <div class="bar">
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="games" aria-selected="true">게임</button><button class="tab" role="tab" data-tab="stats" aria-selected="false">통계</button></div>
      <span class="range" id="range"></span>
    </div>
    <div class="filters">
      <div class="chips" id="fTc"></div>
      <div class="chips" id="fRes"></div>
      <div class="chips" id="fCol"></div>
    </div>
    <div id="pGames"><div class="glist" id="glist"></div><button class="more" id="more">더 보기</button></div>
    <div id="pStats" hidden><div class="sgrid" id="sgrid"></div></div>
  </div>
</section>
</main>

<div class="ana" id="ana" role="dialog" aria-label="게임 분석">
  <div class="ahead"><b id="aTitle"></b><a id="aLink" href="#" target="_blank" rel="noopener">체스닷컴에서 보기</a><button class="x" id="aClose" aria-label="닫기">×</button></div>
  <div class="alay">
    <div>
      <div class="who" id="wTop"></div>
      <div class="bwrap2">
        <div class="evb" id="evb"><i id="evbW"></i><span id="evbT"></span></div>
        <div class="aboard"><div class="ab8" id="ab8"></div><svg class="amarks" id="amarks" viewBox="0 0 8 8" aria-hidden="true"></svg></div>
      </div>
      <div class="who" id="wBot"></div>
      <div class="ctl"><button id="cFirst" aria-label="처음">⏮</button><button id="cPrev" aria-label="이전">◀</button><button id="cNext" aria-label="다음">▶</button><button id="cLast" aria-label="마지막">⏭</button></div>
      <div class="gfig" id="gfig"><svg id="gsvg"></svg></div>
    </div>
    <div class="side">
      <div><div class="prog"><i id="prog"></i></div><p class="ast" id="ast"></p></div>
      <div class="acc2" id="acc2"></div>
      <table class="cls" id="cls"></table>
      <div class="cur" id="cur"></div>
      <div class="mlist" id="mlist"></div>
    </div>
  </div>
</div>

<footer class="band">
  <div class="wrap">
    <p><b>한 수</b></p>
    <p>데이터 Chess.com 공개 API · 엔진 Stockfish (GPLv3) · 기물 cburnett (CC BY-SA 3.0)</p>
  </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="js/stats.js"></script>
<script src="js/analysis.js"></script>
</body>
</html>
