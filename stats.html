<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전적 - 한 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pieces.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header>
  <div class="nav">
    <a class="logo" href="index.html"><span>♞</span>한 수</a>
    <nav aria-label="메뉴"><a href="index.html">퍼즐</a><a href="index.html#list">목록</a><a href="stats.html" aria-current="page">전적</a><a href="analysis.html">분석</a></nav>
  </div>
</header>
<main>
<section class="band top">
  <div class="wrap">
    <h1>전적</h1>
    <form class="search" id="form"><input id="q" placeholder="체스닷컴 닉네임" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="체스닷컴 닉네임"><button>검색</button></form>
    <div class="recent" id="recent"></div>
    <p class="msg" id="msg"></p>
    <div class="prof" id="prof"></div>
    <div class="rates" id="rates"></div>
  </div>
</section>
<section class="band main" id="main">
  <div class="wrap">
    <div class="bar">
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="games" aria-selected="true">게임</button><button class="tab" role="tab" data-tab="stats" aria-selected="false">통계</button></div>
      <span class="range" id="range"></span>
    </div>
    <div class="filters">
      <div class="chips" id="fTc"></div>
      <div class="chips" id="fRes"></div>
      <div class="chips" id="fCol"></div>
    </div>
    <div id="pGames"><div class="glist" id="glist"></div><button class="more" id="more">더 보기</button></div>
    <div id="pStats" hidden><div class="sgrid" id="sgrid"></div></div>
  </div>
</section>
</main>

<footer class="band">
  <div class="wrap">
    <p><b>한 수</b></p>
    <p>데이터 Chess.com 공개 API · 엔진 Stockfish (GPLv3) · 기물 cburnett (CC BY-SA 3.0)</p>
  </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="js/common.js"></script>
<script src="js/stats.js"></script>
<script src="js/analysis.js"></script>
</body>
</html>
