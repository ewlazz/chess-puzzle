<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 수</title>
<meta name="description" content="체스닷컴 닉네임으로 전적, 약점, 오프닝 확인">
<script>
/* 예전 퍼즐 주소(index.html#p3, #rush 등)는 퍼즐 페이지로 */
(function(){var h=location.hash;if(/^#(p\d+|daily|rated|theme|rush|mine|list|play)$/.test(h))location.replace("puzzle.html"+h)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFF0F6">
<link rel="apple-touch-icon" href="icons/app/apple-180.png">
<script src="js/theme.js"></script>
<style>
.hero{background:var(--band);color:#242942}
.hgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,4vw,56px);align-items:center;max-width:1240px;margin:0 auto;padding:clamp(12px,3vw,40px) 0}
@media(max-width:900px){.hgrid{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(38px,5.6vw,60px);margin-bottom:14px}
.hero .lead{color:#505A82;font-size:18px;max-width:34em;margin:0 0 24px}
.hs{display:flex;gap:8px;max-width:520px}
.hs input{flex:1;min-height:56px;border-radius:14px;border:0;padding:0 18px;font-size:18px;background:#fff;color:#242942}
.hs button{min-height:56px;padding:0 26px;border-radius:14px;border:0;background:var(--acc);color:var(--accink);font-weight:700;font-size:18px}
.hrec{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hrec a{min-height:34px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;border:1px solid #C4C9DC;color:#505A82;text-decoration:none;font-size:14px}
.hnote{color:#6A80B4;font-size:14px;margin:14px 0 0}
.demo{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 30px 60px -24px #000c;transform:rotate(-1deg)}
.demo .dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.demo .dh b{font-size:18px}.demo .dh span{font-size:12px;color:var(--muted)}
.fd{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px dashed var(--line)}
.fd i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-style:normal;font-weight:800;color:#fff;background:var(--loss)}
.fd.ok i{background:var(--win)}
.fd b{display:block;font-size:15px}.fd small{color:var(--muted);font-size:13px}
.fd em{display:inline-block;margin-top:6px;font-style:normal;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#5C54D626;color:#5C54D6}
.fd.ok em{background:#5C54D626;color:var(--win)}
.tagx{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:right}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;max-width:1240px;margin:0 auto}
.feat a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card)}
.feat a:hover{border-color:var(--acc)}
.feat b{display:block;font-size:18px;margin-bottom:4px}
.feat span{color:var(--muted);font-size:15px}
.how2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;max-width:1240px;margin:22px auto 0;padding:0;list-style:none;counter-reset:s}
.how2 li{position:relative;padding-left:48px}
.how2 li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-weight:700}
.how2 b{display:block}.how2 span{color:var(--muted);font-size:15px}
.sec h2{max-width:1240px;margin:0 auto}
.hero{padding-top:clamp(40px,6vw,80px)!important;padding-bottom:clamp(40px,6vw,80px)!important}
.hero h1{margin:0 0 28px!important;font-size:clamp(36px,5.4vw,64px)!important;line-height:1.12!important}
.hg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:clamp(32px,6vw,88px);align-items:center}
@media(max-width:820px){.hg{grid-template-columns:minmax(0,1fr)}.dp{max-width:420px}}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hrow>span{font-size:14px;color:#505A82}
.hero .hrec{margin-top:0!important;display:flex;gap:6px;flex-wrap:wrap}
.hrec a{font-size:14px;padding:6px 10px;border:1px solid #C4C9DC;border-radius:3px;color:#242942;text-decoration:none}
.hrec a:hover{border-color:#242942}
.dp{display:block;color:#242942;text-decoration:none}
.dph,.dpf{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0}
.dph b{font-size:18px;font-weight:900}
.dph span,.dpf span{font-size:14px;color:#505A82}
.dph span{font-family:"Inter","Pretendard",sans-serif;font-weight:700}
.dpf b{font-size:15px;color:#5C54D6}
.dp:hover .dpf b{text-decoration:underline}
.dp .ab8{border:1px solid #C4C9DC;border-radius:2px}
</style>
<link rel="stylesheet" href="pieces.css">
<link rel="stylesheet" href="css/paper.css">
</head>
<body>
<header>
  <div class="nav">
    <a class="logo" href="index.html">한 수</a>
    <nav aria-label="메뉴"><a href="puzzle.html">퍼즐</a><a href="stats.html">전적</a><a href="analysis.html">분석</a><a href="opening.html">오프닝</a><a href="play.html">대국</a></nav>
  </div>
</header>
<main>
<section class="band hero">
  <div class="hg">
    <div>
      <h1>닉네임을 검색해서<br>약점을 찾아보세요</h1>
      <form class="hs" id="hf"><input id="hq" placeholder="체스닷컴 닉네임" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="체스닷컴 닉네임"><button>검색</button></form>
      <div class="hrow"><span id="hrl">많이 찾는 닉네임</span><div class="hrec" id="hrec"></div></div>
    </div>
    <a class="dp" href="puzzle.html#daily" aria-label="오늘의 퍼즐 풀기">
      <div class="dph"><b>오늘의 퍼즐</b><span id="dpr"></span></div>
      <div class="ab8" id="dpb"></div>
      <div class="dpf"><span id="dpt">불러오는 중</span><b>풀기</b></div>
    </a>
  </div>
</section>
<section class="band sec">
  <div class="feat">
    <a href="puzzle.html"><b>퍼즐</b><span>오늘의 퍼즐, 테마, 러시</span></a>
    <a href="opening.html"><b>오프닝</b><span>마스터 통계, 레퍼토리 연습</span></a>
    <a href="analysis.html"><b>분석</b><span>PGN, FEN 붙여넣기</span></a>
    <a href="play.html"><b>대국</b><span>스톡피시 레벨 1~10</span></a>
  </div>
</section>
</main>
<footer class="band">
  <div class="wrap">
    <p><b>한 수</b></p>
    <p>데이터 Chess.com 공개 API · 엔진 Stockfish (GPLv3)</p>
  </div>
</footer>
<script>
{
  const go=u=>{u=u.trim();if(u)location.href="stats.html?user="+encodeURIComponent(u)+"&tab=report"};
  document.getElementById("hf").onsubmit=e=>{e.preventDefault();go(document.getElementById("hq").value)};
  let r=[];try{r=JSON.parse(localStorage.getItem("hansu-recent")||"[]")}catch(e){}

  const pop=["hikaru","magnuscarlsen","gothamchess","fabianocaruana"];
  if(!r.length){r=pop}else{document.getElementById("hrl").textContent="최근 검색"}
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  document.getElementById("hrec").innerHTML=r.map(u=>`<a href="stats.html?user=${encodeURIComponent(u)}&tab=report">${esc(u)}</a>`).join("");
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
{
  const B=document.getElementById("dpb"),F="abcdefgh";
  const draw=(fen,last,flip)=>{const c=new Chess(fen);let h="";for(let i=0;i<64;i++){const r=flip?i>>3:7-(i>>3),f=flip?7-(i&7):i&7,sq=F[f]+(r+1),q=c.get(sq),d=(r+f)%2===0;h+=`<div class="s8 ${d?"d":"l"}${last&&last.includes(sq)?" lm":""}">${q?`<i class="pc ${q.color}${q.type}"></i>`:""}</div>`}B.innerHTML=h};
  draw("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
  fetch("https://lichess.org/api/puzzle/daily").then(r=>r.ok?r.json():Promise.reject()).then(x=>{
    const c=new Chess();for(const t of x.game.pgn.split(" ")){if(!c.move(t,{sloppy:true}))break}
    const h=c.history({verbose:true}),l=h[h.length-1],w=c.turn()==="w";
    draw(c.fen(),l?[l.from,l.to]:null,!w);
    document.getElementById("dpt").textContent=(w?"백":"흑")+" 차례";
    document.getElementById("dpr").textContent=x.puzzle.rating;
  }).catch(()=>{document.getElementById("dpt").textContent="매일 새 퍼즐"});
}
</script>
</body>
</html>
